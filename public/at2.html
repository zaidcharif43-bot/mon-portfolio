<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Qur'ān Al-Karīm</title>
  <style>
    /* Variables CSS pour les couleurs brunes et linéaires */
    :root {
      --primary: #8B4513;
      --primary-light: #A0522D;
      --primary-dark: #654321;
      --secondary: #D2691E;
      --accent: #CD853F;
      --background: #FAF0E6;
      --surface: #FFFFFF;
      --text-primary: #5D4037;
      --text-secondary: #795548;
      --border: #E0C9B8;
      --shadow: 0 10px 30px rgba(139, 69, 19, 0.1);
      --shadow-hover: 0 15px 40px rgba(139, 69, 19, 0.15);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* Reset et styles de base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--background) 0%, #FFF8F0 100%);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, var(--secondary) 100%);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxwYXR0ZXJuIGlkPSJwYXR0ZXJuIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiIHBhdHRlcm5UcmFuc2Zvcm09InJvdGF0ZSg0NSkiPjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjA1KSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3QgZmlsbD0idXJsKCNwYXR0ZXJuKSIgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIvPjwvc3ZnPg==');
      opacity: 0.3;
    }

    .header-icon {
      font-size: 48px;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    h1 {
      color: white;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .surah-count {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      font-weight: 500;
    }

    /* Contrôles */
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .select-wrapper,
    .search-wrapper {
      flex: 1;
      min-width: 200px;
    }

    select,
    input[type="text"] {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: var(--surface);
      font-size: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    select:hover,
    input[type="text"]:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }

    select:focus,
    input[type="text"]:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.2);
      border-color: var(--primary);
    }

    .surprise-btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: var(--transition);
      white-space: nowrap;
    }

    .surprise-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%);
    }

    /* Message de chargement */
    .loaded-message {
      background: linear-gradient(135deg, var(--surface) 0%, #FFF8F0 100%);
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text-secondary);
      box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
      display: none;
    }

    #reciterName {
      font-weight: 600;
      color: var(--primary);
    }

    /* États de chargement et erreur */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 20px;
      font-weight: 600;
    }

    .error {
      background: linear-gradient(135deg, #E57373 0%, #EF5350 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: var(--shadow);
      display: none;
    }

    /* Conteneur des sourates */
    .surah-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    /* Cartes de sourates */
    .surah-card {
      background: linear-gradient(135deg, var(--surface) 0%, #FFF8F0 100%);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      cursor: pointer;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .surah-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .surah-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--primary), var(--secondary));
    }

    .surah-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .surah-number {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(139, 69, 19, 0.3);
    }

    .surah-info {
      flex: 1;
      margin: 0 20px;
    }

    .surah-name-ar {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .surah-name-en {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    .surah-meta {
      text-align: right;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .audio-player {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
    }

    audio::-webkit-media-controls-panel {
      background: linear-gradient(135deg, #FAF0E6 0%, #F5E6D3 100%);
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .page-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--surface) 0%, #FFF8F0 100%);
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .page-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-numbers {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .page-number {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--surface) 0%, #FFF8F0 100%);
      color: var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
      border: 2px solid transparent;
      box-shadow: var(--shadow);
    }

    .page-number:hover {
      background: #F5E6D3;
      transform: translateY(-2px);
      border-color: var(--border);
    }

    .page-number.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border-color: var(--primary);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(139, 69, 19, 0.8);
      animation: fadeIn 0.3s ease;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .modal-content {
      background: linear-gradient(135deg, var(--surface) 0%, #FFF8F0 100%);
      border-radius: 20px;
      padding: 0;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(139, 69, 19, 0.3);
      animation: slideUp 0.3s ease;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, var(--secondary) 100%);
      color: white;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .modal-header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxwYXR0ZXJuIGlkPSJwYXR0ZXJuIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiIHBhdHRlcm5UcmFuc2Zvcm09InJvdGF0ZSg0NSkiPjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjA1KSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3QgZmlsbD0idXJsKCNwYXR0ZXJuKSIgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIvPjwvc3ZnPg==');
      opacity: 0.2;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 24px;
      position: relative;
      z-index: 1;
    }

    .modal-body {
      padding: 30px;
    }

    #surpriseContent {
      text-align: center;
      margin-bottom: 20px;
    }

    .surprise-number {
      font-size: 48px;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 10px;
    }

    #surpriseName {
      font-size: 28px;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    #surpriseReciter {
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    #surpriseVerses {
      color: var(--text-secondary);
      font-size: 14px;
    }

    #surpriseAudio {
      width: 100%;
      margin-top: 20px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 32px;
      }

      .controls {
        flex-direction: column;
      }

      .surprise-btn {
        width: 100%;
      }

      .surah-container {
        grid-template-columns: 1fr;
      }

      .surah-header {
        flex-direction: column;
        text-align: center;
      }

      .surah-info {
        margin: 16px 0;
      }

      .surah-meta {
        text-align: center;
      }

      .pagination {
        flex-direction: column;
      }

      .page-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-icon">📖</div>
      <h1>الْقُرْآنُ الْكَرِيمُ</h1>
      <p class="surah-count">Nombre de sourates : 114</p>
    </header>

    <div class="controls">
      <div class="select-wrapper">
        <select id="reciterSelect">
          <option value="AbdulBaset_AbdulSamad">AbdulBaset AbdulSamad</option>
          <option value="Abdul_Basit_Murattal">Abdul Basit Murattal</option>
          <option value="Mishary_Rashid_Alafasy">
            Mishary Rashid Alafasy
          </option>
        </select>
      </div>

      <div class="search-wrapper">
        <input
          type="text"
          id="searchInput"
          placeholder="Rechercher une sourate"
        />
      </div>

      <div class="select-wrapper">
        <select id="sortSelect">
          <option value="original">Trier par longueur</option>
          <option value="shortest">Plus courtes d'abord</option>
          <option value="longest">Plus longues d'abord</option>
        </select>
      </div>

      <button class="surprise-btn" id="surpriseBtn">Surprends-moi</button>
    </div>

    <div class="loaded-message" id="loadedMessage">
      Sourates chargées pour
      <span id="reciterName">AbdulBaset AbdulSamad</span>.
    </div>

    <div id="loading" class="loading">Chargement...</div>
    <div id="error" class="error" style="display: none"></div>

    <div id="surahContainer" class="surah-container">
      <!-- Les sourates seront chargées ici -->
    </div>

    <div class="pagination" id="pagination">
      <button id="prevBtn" class="page-btn">← Précédent</button>
      <div id="pageNumbers" class="page-numbers"></div>
      <button id="nextBtn" class="page-btn">Suivant →</button>
    </div>

    <!-- Modal de surprise -->
    <div id="surpriseModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Sourate surprise</h2>
        </div>
        <div class="modal-body">
          <div id="surpriseContent">
            <p class="surprise-number" id="surpriseNumber"></p>
            <h3 id="surpriseName"></h3>
            <p id="surpriseReciter"></p>
            <p id="surpriseVerses"></p>
          </div>
          <audio id="surpriseAudio" controls></audio>
        </div>
      </div>
    </div>
  </div>

  <script>
    // API Configuration
    const API_BASE_URL = "https://api.quran.com/api/v4";

    // State
    let allSurahs = [];
    let filteredSurahs = [];
    let currentPage = 1;
    const surahsPerPage = 5;

    // Reciter mapping (using actual audio slugs from Islamic Network API)
    const reciterMap = {
      AbdulBaset_AbdulSamad: {
        slug: "ar.abdulbasitmurattal",
        name: "AbdulBaset AbdulSamad",
      },
      Abdul_Basit_Murattal: {
        slug: "ar.abdulbasitmurattal",
        name: "Abdul Basit Murattal",
      },
      "Abdur_Rahman_as-Sudais": {
        slug: "ar.abdurrahmaansudais",
        name: "Abdur-Rahman as-Sudais",
      },
      Mishary_Rashid_Alafasy: {
        slug: "ar.alafasy",
        name: "Mishary Rashid Alafasy",
      },
      "Sa'ud_ash-Shuraym": { slug: "ar.shaatree", name: "Sa'ud ash-Shuraym" },
    };

    // DOM Elements
    const surahContainer = document.getElementById("surahContainer");
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const searchInput = document.getElementById("searchInput");
    const reciterSelect = document.getElementById("reciterSelect");
    const sortSelect = document.getElementById("sortSelect");
    const surpriseBtn = document.getElementById("surpriseBtn");
    const surpriseModal = document.getElementById("surpriseModal");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageNumbers = document.getElementById("pageNumbers");
    const reciterNameEl = document.getElementById("reciterName");
    const loadedMessage = document.getElementById("loadedMessage");

    // Initialize
    async function init() {
      await loadSurahs();
      setupEventListeners();
    }

    // Load Surahs from API
    async function loadSurahs() {
      try {
        loadingEl.style.display = "block";
        errorEl.style.display = "none";
        loadedMessage.style.display = "none";

        const response = await fetch(`${API_BASE_URL}/chapters`);
        if (!response.ok) throw new Error("Failed to fetch surahs");

        const data = await response.json();
        allSurahs = data.chapters;
        filteredSurahs = [...allSurahs];

        loadingEl.style.display = "none";
        loadedMessage.style.display = "block";
        renderSurahs();
        renderPagination();
      } catch (error) {
        console.error("Error loading surahs:", error);
        loadingEl.style.display = "none";
        errorEl.style.display = "block";
        errorEl.textContent =
          "Erreur lors du chargement des sourates. Veuillez réessayer.";
      }
    }

    // Render Surahs for current page
    function renderSurahs() {
      const startIndex = (currentPage - 1) * surahsPerPage;
      const endIndex = startIndex + surahsPerPage;
      const surahsToDisplay = filteredSurahs.slice(startIndex, endIndex);

      surahContainer.innerHTML = "";

      surahsToDisplay.forEach((surah) => {
        const card = createSurahCard(surah);
        surahContainer.appendChild(card);
      });

      updatePaginationButtons();
    }

    // Create Surah Card
    function createSurahCard(surah) {
      const card = document.createElement("div");
      card.className = "surah-card";

      const selectedReciter = reciterSelect.value;
      const reciterInfo = reciterMap[selectedReciter];
      const audioUrl = `https://cdn.islamic.network/quran/audio-surah/128/${reciterInfo.slug}/${surah.id}.mp3`;

      card.innerHTML = `
        <div class="surah-header">
            <div class="surah-number">${surah.id}</div>
            <div class="surah-info">
                <div class="surah-name-ar">${surah.name_arabic}</div>
                <div class="surah-name-en">${surah.name_simple} - ${surah.translated_name.name}</div>
            </div>
            <div class="surah-meta">
                ${surah.verses_count} versets · Sourate n°${surah.id}
            </div>
        </div>
        <div class="audio-player">
            <audio controls preload="none">
                <source src="${audioUrl}" type="audio/mpeg">
                Votre navigateur ne supporte pas l'élément audio.
            </audio>
        </div>
      `;

      return card;
    }

    // Render Pagination
    function renderPagination() {
      const totalPages = Math.ceil(filteredSurahs.length / surahsPerPage);
      pageNumbers.innerHTML = "";

      // Show max 7 page numbers
      let startPage = Math.max(1, currentPage - 3);
      let endPage = Math.min(totalPages, startPage + 6);

      if (endPage - startPage < 6) {
        startPage = Math.max(1, endPage - 6);
      }

      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement("div");
        pageBtn.className = "page-number";
        if (i === currentPage) pageBtn.classList.add("active");
        pageBtn.textContent = i;
        pageBtn.addEventListener("click", () => goToPage(i));
        pageNumbers.appendChild(pageBtn);
      }
    }

    // Update Pagination Buttons
    function updatePaginationButtons() {
      const totalPages = Math.ceil(filteredSurahs.length / surahsPerPage);
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    }

    // Go to Page
    function goToPage(page) {
      currentPage = page;
      renderSurahs();
      renderPagination();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Search Surahs
    function searchSurahs(query) {
      const searchTerm = query.toLowerCase().trim();

      if (searchTerm === "") {
        filteredSurahs = [...allSurahs];
      } else {
        filteredSurahs = allSurahs.filter(
          (surah) =>
            surah.name_simple.toLowerCase().includes(searchTerm) ||
            surah.name_arabic.includes(searchTerm) ||
            surah.translated_name.name.toLowerCase().includes(searchTerm) ||
            surah.id.toString() === searchTerm
        );
      }

      currentPage = 1;
      renderSurahs();
      renderPagination();
    }

    // Sort Surahs by Length
    function sortSurahs(sortType) {
      if (sortType === "shortest") {
        filteredSurahs.sort((a, b) => a.verses_count - b.verses_count);
      } else if (sortType === "longest") {
        filteredSurahs.sort((a, b) => b.verses_count - a.verses_count);
      } else {
        filteredSurahs.sort((a, b) => a.id - b.id);
      }

      currentPage = 1;
      renderSurahs();
      renderPagination();
    }

    // Show Random Surah
    function showSurpriseSurah() {
      const randomSurah = allSurahs[Math.floor(Math.random() * allSurahs.length)];
      const alafasyReciter = reciterMap["Mishary_Rashid_Alafasy"];
      const audioUrl = `https://cdn.islamic.network/quran/audio-surah/128/${alafasyReciter.slug}/${randomSurah.id}.mp3`;

      document.getElementById("surpriseNumber").textContent = `${randomSurah.id}. ${randomSurah.name_arabic}`;
      document.getElementById("surpriseName").textContent = randomSurah.translated_name.name;
      document.getElementById("surpriseReciter").textContent = alafasyReciter.name;
      document.getElementById("surpriseVerses").textContent = `${randomSurah.verses_count} versets · Sourate n°${randomSurah.id}`;

      const audio = document.getElementById("surpriseAudio");
      audio.src = audioUrl;

      surpriseModal.classList.add("show");
    }

    // Setup Event Listeners
    function setupEventListeners() {
      // Search
      searchInput.addEventListener("input", (e) => {
        searchSurahs(e.target.value);
      });

      // Reciter Change
      reciterSelect.addEventListener("change", (e) => {
        const reciterInfo = reciterMap[e.target.value];
        reciterNameEl.textContent = reciterInfo.name;
        renderSurahs(); // Re-render to update audio sources
      });

      // Sort Change
      sortSelect.addEventListener("change", (e) => {
        sortSurahs(e.target.value);
      });

      // Surprise Button
      surpriseBtn.addEventListener("click", showSurpriseSurah);

      // Modal Close
      surpriseModal.addEventListener("click", (e) => {
        if (e.target === surpriseModal) {
          surpriseModal.classList.remove("show");
          const audio = document.getElementById("surpriseAudio");
          audio.pause();
        }
      });

      // Pagination
      prevBtn.addEventListener("click", () => {
        if (currentPage > 1) {
          goToPage(currentPage - 1);
        }
      });

      nextBtn.addEventListener("click", () => {
        const totalPages = Math.ceil(filteredSurahs.length / surahsPerPage);
        if (currentPage < totalPages) {
          goToPage(currentPage + 1);
        }
      });
    }

    // Start the app
    init();
  </script>
</body>
</html>
